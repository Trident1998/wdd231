<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Mobile wireframe of Bukovel Experience home page">
    <style>
        .stroke{stroke:#1e3a5f;stroke-width:1.5;fill:#ffffff}
        .placeholder{stroke:#4a525e;stroke-width:1;fill:#f0ece5}
        .label{font-family:'Source Sans 3',Arial,sans-serif;font-size:11px;fill:#1a1a1a}
        .label-bold{font-family:'Source Sans 3',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1e3a5f}
        .navy{fill:#1e3a5f}
        .accent{fill:#9c3f0a}
        .x{stroke:#4a525e;stroke-width:1}
    </style>

    <rect x="0" y="0" width="360" height="640" fill="#faf7f2"/>

    <!-- Phone frame -->
    <rect x="10" y="10" width="340" height="620" rx="18" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Status bar -->
    <text class="label" x="30" y="32">9:41</text>
    <text class="label" x="305" y="32">100%</text>

    <!-- Header -->
    <rect class="navy" x="20" y="45" width="320" height="48"/>
    <rect class="placeholder" x="30" y="55" width="28" height="28"/>
    <text class="label-bold" x="64" y="68" fill="#ffffff">Bukovel</text>
    <text class="label-bold" x="64" y="82" fill="#ffd5b8">Experience</text>
    <rect fill="#ffffff" x="305" y="60" width="22" height="3"/>
    <rect fill="#ffffff" x="305" y="68" width="22" height="3"/>
    <rect fill="#ffffff" x="305" y="76" width="22" height="3"/>

    <!-- Hero carousel -->
    <rect class="placeholder" x="20" y="105" width="320" height="160"/>
    <line class="x" x1="20" y1="105" x2="340" y2="265"/>
    <line class="x" x1="340" y1="105" x2="20" y2="265"/>
    <text class="label" x="115" y="190">carousel slide image</text>
    <circle cx="160" cy="250" r="4" class="accent"/>
    <circle cx="174" cy="250" r="4" fill="#d8d2c7"/>
    <circle cx="188" cy="250" r="4" fill="#d8d2c7"/>
    <circle cx="202" cy="250" r="4" fill="#d8d2c7"/>

    <!-- Hero CTA -->
    <rect class="accent" x="105" y="280" width="150" height="34" rx="4"/>
    <text class="label" x="180" y="301" text-anchor="middle" fill="#ffffff" font-weight="700">Explore Activities</text>

    <!-- Weather widget -->
    <rect class="stroke" x="20" y="330" width="320" height="100"/>
    <rect class="navy" x="20" y="330" width="320" height="22"/>
    <text class="label" x="35" y="346" fill="#ffffff" font-weight="700">Live Weather - Bukovel</text>
    <circle cx="60" cy="385" r="14" fill="#ffd5b8"/>
    <text class="label-bold" x="100" y="380" font-size="20">-3 C</text>
    <text class="label" x="100" y="398">Light snow - Wind 4 m/s</text>
    <text class="label" x="35" y="420">Today: -2 / -8 C</text>

    <!-- News -->
    <rect class="stroke" x="20" y="445" width="320" height="115"/>
    <rect class="navy" x="20" y="445" width="320" height="22"/>
    <text class="label" x="35" y="461" fill="#ffffff" font-weight="700">Latest News</text>
    <text class="label-bold" x="35" y="485">Season pass sales open</text>
    <text class="label" x="35" y="500">Dec 1 - early bird ends Dec 15.</text>
    <line class="x" x1="35" y1="510" x2="325" y2="510"/>
    <text class="label-bold" x="35" y="525">New summer trails announced</text>
    <text class="label" x="35" y="540">Five trails added for warm season.</text>

    <!-- Footer -->
    <rect class="navy" x="20" y="572" width="320" height="48"/>
    <text class="label" x="35" y="590" fill="#ffffff">Bukovel Experience - WDD 231</text>
    <text class="label" x="35" y="606" fill="#ffd5b8">Dmytro Ivanytskyi - 2026</text>
</svg>
